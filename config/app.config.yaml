# Everything a team may want to tune lives here, not in the code.

# Each environment is one Kubernetes namespace.
environments:
  staging:
    namespace: staging
  prod:
    namespace: prod
    protected: true # the Confirm step shows an extra warning

# Defaults used when the assistant creates or updates a Deployment.
apps:
  sample-app:
    imageRepository: sample-app
    port: 8080
    replicas: 3 # used the first time the app is deployed
    maxReplicas: 10 # the assistant refuses to scale beyond this
    resources:
      requests:
        cpu: 100m
        memory: 128Mi
      limits:
        cpu: 500m
        memory: 256Mi

# The suggested answers when a service is created from the chat ("create a service").
# Typing "default" at a question takes the value from here.
serviceDefaults:
  port: 8080 # used when the Dockerfile names no port
  healthPath: /health # must answer 200 when the app is ready
  replicas: 2 # copies started the first time the service is deployed
  maxReplicas: 10 # the assistant refuses to scale beyond this
  resources:
    requests: # reserved for each copy
      cpu: 100m
      memory: 128Mi
    limits: # the most each copy may use
      cpu: 500m
      memory: 256Mi

# Building images from project folders.
build:
  # Only folders inside one of these may be built. "~" is the home folder of whoever runs the assistant.
  allowedRoots:
    - "~" # keep the quotes: without them YAML reads ~ as "no value"
  timeoutSeconds: 900 # give up on one build, upload or Terraform run after this long

timeouts:
  rolloutSeconds: 180 # give up waiting for a rollout after this long
  healthRequestMs: 3000 # give up on one GET /health call after this long
  pollIntervalMs: 2000 # how often rollout status is read

# Reading chat messages with OpenAI. Used only when OPENAI_API_KEY is set (see
# .env.example). Without a key the built-in rules read every message.
llm:
  model: gpt-4.1-mini # any OpenAI chat model that supports function calling
  requestTimeoutMs: 8000 # give up on one OpenAI call after this long and use the rules
  retryAfterSeconds: 60 # after a failed call, use the rules for this long before trying OpenAI again

# When an app is reported as DEGRADED.
thresholds:
  default:
    memoryPercentOfLimit: 85 # memory use above this share of the limit
    cpuPercentOfLimit: 90 # CPU use above this share of the limit
    restartCount: 3 # a pod restarted more than this many times
    oomKillWindowMinutes: 30 # an OOMKill this recent still counts
    healthResponseMs: 1000 # /health slower than this
    pendingSeconds: 60 # a pod stuck in Pending longer than this
  # Per-environment values that replace the defaults above, for example:
  #   overrides:
  #     prod:
  #       memoryPercentOfLimit: 75
  overrides: {}
